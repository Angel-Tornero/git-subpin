name: Test action

# Runs the published action from the release branch on every supported runner,
# to confirm the shim picks the right binary and the action starts end to end.
# Dispatch manually after a release has been published.
on:
  workflow_dispatch:

jobs:
  run:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Run git-subpin
        uses: Angel-Tornero/git-subpin@release
        with:
          from: dev
          to: prod
          config: .subpin.yml
